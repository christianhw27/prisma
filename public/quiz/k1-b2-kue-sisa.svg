<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" width="100%" height="100%">
  <rect width="560" height="230" fill="none"/>

  <text x="280" y="28" text-anchor="middle" font-family="'Baloo 2', cursive, sans-serif" font-size="18" font-weight="bold" fill="#2B3445">
    12 Kue Bolu Harum Buatan Ibu
  </text>

  <!-- Nampan Kue Utama (12 Kue) -->
  <g transform="translate(35, 45)">
    <rect x="0" y="0" width="490" height="160" rx="20" fill="#FFF8F0" stroke="#8F8575" stroke-opacity="0.3" stroke-width="1.8"/>

    <!-- Defs for cupcake/kue -->
    <defs>
      <g id="kue-bolu">
        <ellipse cx="20" cy="30" rx="18" ry="7" fill="#EADBC8" opacity="0.5"/>
        <path d="M 6 22 L 34 22 L 30 35 L 10 35 Z" fill="#FFE082" stroke="#FFB300" stroke-width="1.2"/>
        <circle cx="20" cy="16" r="14" fill="#FF8A65" stroke="#E64A19" stroke-width="1.2"/>
        <circle cx="20" cy="7" r="3.5" fill="#C62828"/>
      </g>
    </defs>

    <!-- 5 Kue Diberikan ke Bu Tini (Dikelilingi Box Putus-putus) -->
    <rect x="20" y="15" width="190" height="125" rx="14" fill="#FFDE7A" fill-opacity="0.2" stroke="#D97706" stroke-width="1.8" stroke-dasharray="6 4"/>
    <text x="115" y="130" text-anchor="middle" font-family="'Lexend', sans-serif" font-size="11" font-weight="bold" fill="#B45309">
      5 Kue untuk Bu Tini 🎁
    </text>

    <!-- Baris 1 dalam box Bu Tini (3 kue) -->
    <use href="#kue-bolu" x="35" y="25"/>
    <use href="#kue-bolu" x="90" y="25"/>
    <use href="#kue-bolu" x="145" y="25"/>
    <!-- Baris 2 dalam box Bu Tini (2 kue) -->
    <use href="#kue-bolu" x="62" y="70"/>
    <use href="#kue-bolu" x="118" y="70"/>

    <!-- Pemisah Panah / Garis -->
    <line x1="235" y1="20" x2="235" y2="140" stroke="#8F8575" stroke-opacity="0.25" stroke-dasharray="4 4"/>

    <!-- Sisa Kue (7 Kue yang tersisa) -->
    <rect x="255" y="15" width="215" height="125" rx="14" fill="#7FD4C4" fill-opacity="0.15" stroke="#1E7A6F" stroke-width="1.8"/>
    <text x="362" y="130" text-anchor="middle" font-family="'Lexend', sans-serif" font-size="11" font-weight="bold" fill="#1E7A6F">
      Sisa Kue yang Ada = ?
    </text>

    <!-- Baris 1 Sisa (4 kue) -->
    <use href="#kue-bolu" x="270" y="25"/>
    <use href="#kue-bolu" x="320" y="25"/>
    <use href="#kue-bolu" x="370" y="25"/>
    <use href="#kue-bolu" x="420" y="25"/>
    <!-- Baris 2 Sisa (3 kue) -->
    <use href="#kue-bolu" x="295" y="70"/>
    <use href="#kue-bolu" x="345" y="70"/>
    <use href="#kue-bolu" x="395" y="70"/>
  </g>
</svg>
