<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 235" width="100%" height="100%">
  <defs>
    <!-- Vector Tempat Sampah Hijau / Recycle Bin -->
    <g id="icon-trash-can">
      <!-- Shadow -->
      <ellipse cx="16" cy="33" rx="14" ry="3" fill="#2B3445" opacity="0.12"/>
      
      <!-- Bin Body (Tapered) -->
      <polygon points="5,9 27,9 24,31 8,31" fill="#43A047" stroke="#2E7D32" stroke-width="1.2" stroke-linejoin="round"/>
      
      <!-- Vertical ribs for 3D depth -->
      <line x1="11" y1="11" x2="11" y2="28" stroke="#388E3C" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="16" y1="11" x2="16" y2="28" stroke="#66BB6A" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="21" y1="11" x2="21" y2="28" stroke="#2E7D32" stroke-width="1.2" stroke-linecap="round"/>

      <!-- Recycle Symbol in White -->
      <circle cx="16" cy="20" r="4.5" fill="#2E7D32" opacity="0.5"/>
      <text x="16" y="23.5" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="bold" fill="#FFFFFF">♻</text>

      <!-- Rim & Lid -->
      <rect x="3" y="6" width="26" height="4" rx="2" fill="#2E7D32"/>
      <!-- Lid Handle -->
      <rect x="11" y="3" width="10" height="3.5" rx="1.5" fill="#1B5E20"/>
    </g>
  </defs>

  <!-- Title & Legend Header (Compact & Crisp) -->
  <text x="290" y="22" text-anchor="middle" font-family="'Baloo 2', cursive, sans-serif" font-size="16" font-weight="bold" fill="#2B3445">
    Piktogram Sampah Terkumpul per Kelas
  </text>
  
  <g transform="translate(135, 30)">
    <rect x="0" y="0" width="310" height="24" rx="8" fill="#7FD4C4" fill-opacity="0.25" stroke="#1E7A6F" stroke-width="1.2"/>
    <use href="#icon-trash-can" x="14" y="-2" transform="scale(0.65)"/>
    <text x="165" y="16" text-anchor="middle" font-family="'Lexend', sans-serif" font-size="11" font-weight="bold" fill="#1E7A6F">
      Keterangan: 1 Tempat Sampah = 2 Kantong
    </text>
  </g>

  <!-- Baris 1: Kelas 1 (3 Tempat Sampah) -->
  <g transform="translate(30, 62)">
    <rect x="0" y="0" width="520" height="38" rx="10" fill="#FFF8F0" stroke="#8F8575" stroke-opacity="0.18" stroke-width="1"/>
    <text x="20" y="24" font-family="'Baloo 2', cursive, sans-serif" font-size="14" font-weight="bold" fill="#2B3445">Kelas 1</text>
    <use href="#icon-trash-can" x="130" y="1"/>
    <use href="#icon-trash-can" x="175" y="1"/>
    <use href="#icon-trash-can" x="220" y="1"/>
  </g>

  <!-- Baris 2: Kelas 2 (4 Tempat Sampah) -->
  <g transform="translate(30, 104)">
    <rect x="0" y="0" width="520" height="38" rx="10" fill="#FFFFFF" stroke="#8F8575" stroke-opacity="0.18" stroke-width="1"/>
    <text x="20" y="24" font-family="'Baloo 2', cursive, sans-serif" font-size="14" font-weight="bold" fill="#2B3445">Kelas 2</text>
    <use href="#icon-trash-can" x="130" y="1"/>
    <use href="#icon-trash-can" x="175" y="1"/>
    <use href="#icon-trash-can" x="220" y="1"/>
    <use href="#icon-trash-can" x="265" y="1"/>
  </g>

  <!-- Baris 3: Kelas 3 (6 Tempat Sampah) -->
  <g transform="translate(30, 146)">
    <rect x="0" y="0" width="520" height="38" rx="10" fill="#FFF8F0" stroke="#8F8575" stroke-opacity="0.18" stroke-width="1"/>
    <text x="20" y="24" font-family="'Baloo 2', cursive, sans-serif" font-size="14" font-weight="bold" fill="#2B3445">Kelas 3</text>
    <use href="#icon-trash-can" x="130" y="1"/>
    <use href="#icon-trash-can" x="175" y="1"/>
    <use href="#icon-trash-can" x="220" y="1"/>
    <use href="#icon-trash-can" x="265" y="1"/>
    <use href="#icon-trash-can" x="310" y="1"/>
    <use href="#icon-trash-can" x="355" y="1"/>
  </g>

  <!-- Baris 4: Kelas 4 (5 Tempat Sampah) -->
  <g transform="translate(30, 188)">
    <rect x="0" y="0" width="520" height="38" rx="10" fill="#FFFFFF" stroke="#8F8575" stroke-opacity="0.18" stroke-width="1"/>
    <text x="20" y="24" font-family="'Baloo 2', cursive, sans-serif" font-size="14" font-weight="bold" fill="#2B3445">Kelas 4</text>
    <use href="#icon-trash-can" x="130" y="1"/>
    <use href="#icon-trash-can" x="175" y="1"/>
    <use href="#icon-trash-can" x="220" y="1"/>
    <use href="#icon-trash-can" x="265" y="1"/>
    <use href="#icon-trash-can" x="310" y="1"/>
  </g>
</svg>
