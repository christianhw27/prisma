<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="100%" height="100%">
  <rect width="500" height="220" rx="20" fill="none" stroke="none" stroke-width="2" stroke-opacity="0.3"/>
  <text x="250" y="30" text-anchor="middle" font-family="Baloo 2, cursive" font-size="16" font-weight="bold" fill="#2B3445">Perbandingan Potongan Roti Bakar</text>

  <!-- Roti A: 1/3 bagian -->
  <g transform="translate(130, 110)">
    <rect x="-80" y="-35" width="160" height="70" rx="12" fill="#FFFFFF" stroke="#8F8575" stroke-width="2"/>
    <rect x="-80" y="-35" width="53" height="70" rx="10" fill="#7FD4C4" stroke="#2B3445" stroke-width="2"/>
    <line x1="-27" y1="-35" x2="-27" y2="35" stroke="#8F8575" stroke-width="2"/>
    <line x1="26" y1="-35" x2="26" y2="35" stroke="#8F8575" stroke-width="2"/>
    <text x="0" y="65" text-anchor="middle" font-family="Baloo 2" font-size="16" font-weight="bold" fill="#1E7A6F">1/3 Roti (Lia)</text>
    <text x="0" y="85" text-anchor="middle" font-family="Lexend" font-size="12" fill="#5B6474">Potongan Lebih Besar</text>
  </g>

  <!-- Roti B: 1/6 bagian -->
  <g transform="translate(370, 110)">
    <rect x="-80" y="-35" width="160" height="70" rx="12" fill="#FFFFFF" stroke="#8F8575" stroke-width="2"/>
    <rect x="-80" y="-35" width="26" height="70" rx="8" fill="#FFB899" stroke="#2B3445" stroke-width="2"/>
    <line x1="-54" y1="-35" x2="-54" y2="35" stroke="#8F8575" stroke-width="1.5"/>
    <line x1="-27" y1="-35" x2="-27" y2="35" stroke="#8F8575" stroke-width="1.5"/>
    <line x1="0" y1="-35" x2="0" y2="35" stroke="#8F8575" stroke-width="1.5"/>
    <line x1="27" y1="-35" x2="27" y2="35" stroke="#8F8575" stroke-width="1.5"/>
    <line x1="54" y1="-35" x2="54" y2="35" stroke="#8F8575" stroke-width="1.5"/>
    <text x="0" y="65" text-anchor="middle" font-family="Baloo 2" font-size="16" font-weight="bold" fill="#2B3445">1/6 Roti (Teman)</text>
    <text x="0" y="85" text-anchor="middle" font-family="Lexend" font-size="12" fill="#5B6474">Potongan Lebih Kecil</text>
  </g>
</svg>