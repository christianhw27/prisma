<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="100%" height="100%">
  <rect width="500" height="240" rx="20" fill="none" stroke="none" stroke-width="2" stroke-opacity="0.3"/>
  <text x="250" y="30" text-anchor="middle" font-family="Baloo 2, cursive" font-size="16" font-weight="bold" fill="#2B3445">Piktogram Buah Kesukaan (1 Lingkaran = 1 Anak)</text>
  
  <!-- Pisang -->
  <g transform="translate(40, 65)">
    <text x="0" y="14" font-family="Lexend" font-size="14" font-weight="bold" fill="#2B3445">🍌 Pisang</text>
    <circle cx="150" cy="10" r="12" fill="#FFDE7A" stroke="#2B3445" stroke-width="2"/>
    <circle cx="185" cy="10" r="12" fill="#FFDE7A" stroke="#2B3445" stroke-width="2"/>
    <circle cx="220" cy="10" r="12" fill="#FFDE7A" stroke="#2B3445" stroke-width="2"/>
    <circle cx="255" cy="10" r="12" fill="#FFDE7A" stroke="#2B3445" stroke-width="2"/>
    <circle cx="290" cy="10" r="12" fill="#FFDE7A" stroke="#2B3445" stroke-width="2"/>
    <text x="420" y="15" font-family="Lexend" font-size="14" font-weight="bold" fill="#2B3445">5 anak</text>
  </g>

  <!-- Jeruk -->
  <g transform="translate(40, 110)">
    <text x="0" y="14" font-family="Lexend" font-size="14" font-weight="bold" fill="#2B3445">🍊 Jeruk</text>
    <circle cx="150" cy="10" r="12" fill="#FFA726" stroke="#2B3445" stroke-width="2"/>
    <circle cx="185" cy="10" r="12" fill="#FFA726" stroke="#2B3445" stroke-width="2"/>
    <circle cx="220" cy="10" r="12" fill="#FFA726" stroke="#2B3445" stroke-width="2"/>
    <text x="420" y="15" font-family="Lexend" font-size="14" font-weight="bold" fill="#2B3445">3 anak</text>
  </g>

  <!-- Mangga -->
  <g transform="translate(40, 155)">
    <text x="0" y="14" font-family="Lexend" font-size="14" font-weight="bold" fill="#2B3445">🥭 Mangga</text>
    <circle cx="150" cy="10" r="12" fill="#7FD4C4" stroke="#2B3445" stroke-width="2"/>
    <circle cx="185" cy="10" r="12" fill="#7FD4C4" stroke="#2B3445" stroke-width="2"/>
    <circle cx="220" cy="10" r="12" fill="#7FD4C4" stroke="#2B3445" stroke-width="2"/>
    <circle cx="255" cy="10" r="12" fill="#7FD4C4" stroke="#2B3445" stroke-width="2"/>
    <circle cx="290" cy="10" r="12" fill="#7FD4C4" stroke="#2B3445" stroke-width="2"/>
    <circle cx="325" cy="10" r="12" fill="#7FD4C4" stroke="#2B3445" stroke-width="2"/>
    <circle cx="360" cy="10" r="12" fill="#7FD4C4" stroke="#2B3445" stroke-width="2"/>
    <text x="420" y="15" font-family="Lexend" font-size="14" font-weight="bold" fill="#1E7A6F">7 anak</text>
  </g>

  <!-- Semangka -->
  <g transform="translate(40, 200)">
    <text x="0" y="14" font-family="Lexend" font-size="14" font-weight="bold" fill="#2B3445">🍉 Semangka</text>
    <circle cx="150" cy="10" r="12" fill="#EF5350" stroke="#2B3445" stroke-width="2"/>
    <circle cx="185" cy="10" r="12" fill="#EF5350" stroke="#2B3445" stroke-width="2"/>
    <text x="420" y="15" font-family="Lexend" font-size="14" font-weight="bold" fill="#2B3445">2 anak</text>
  </g>
</svg>