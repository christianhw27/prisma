<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="100%" height="100%">
  <rect width="520" height="220" rx="20" fill="#FFF8F0" stroke="#8F8575" stroke-width="2" stroke-opacity="0.3"/>
  <text x="260" y="30" text-anchor="middle" font-family="Baloo 2, cursive" font-size="16" font-weight="bold" fill="#2B3445">Mengenal 3 Jenis Sudut</text>

  <!-- Sudut Lancip (<90°) -->
  <g transform="translate(85, 140)">
    <line x1="0" y1="0" x2="65" y2="0" stroke="#2B3445" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="45" y2="-55" stroke="#2B3445" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 22,0 A 22 22 0 0 0 15,-18" fill="none" stroke="#FFB899" stroke-width="3"/>
    <text x="32" y="30" text-anchor="middle" font-family="Lexend" font-size="13" font-weight="bold" fill="#2B3445">(A) Sudut Lancip</text>
    <text x="32" y="48" text-anchor="middle" font-family="Lexend" font-size="11" fill="#5B6474">&lt; 90°</text>
  </g>

  <!-- Sudut Siku-Siku (90°) -->
  <g transform="translate(250, 140)">
    <line x1="0" y1="0" x2="65" y2="0" stroke="#2B3445" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="-65" stroke="#2B3445" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Tanda Siku -->
    <rect x="0" y="-18" width="18" height="18" fill="none" stroke="#1E7A6F" stroke-width="3"/>
    <text x="32" y="30" text-anchor="middle" font-family="Lexend" font-size="13" font-weight="bold" fill="#1E7A6F">(B) Sudut Siku-Siku</text>
    <text x="32" y="48" text-anchor="middle" font-family="Lexend" font-size="11" fill="#5B6474">Tepat 90°</text>
  </g>

  <!-- Sudut Tumpul (>90°) -->
  <g transform="translate(420, 140)">
    <line x1="0" y1="0" x2="65" y2="0" stroke="#2B3445" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-45" y2="-50" stroke="#2B3445" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 24,0 A 24 24 0 0 0 -15,-18" fill="none" stroke="#94C6FF" stroke-width="3"/>
    <text x="10" y="30" text-anchor="middle" font-family="Lexend" font-size="13" font-weight="bold" fill="#2B3445">(C) Sudut Tumpul</text>
    <text x="10" y="48" text-anchor="middle" font-family="Lexend" font-size="11" fill="#5B6474">Antara 90° - 180°</text>
  </g>
</svg>