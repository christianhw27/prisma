<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" width="100%" height="100%">
  <rect width="560" height="210" fill="none"/>

  <text x="280" y="28" text-anchor="middle" font-family="'Baloo 2', cursive, sans-serif" font-size="18" font-weight="bold" fill="#2B3445">
    Daftar Belanjaan Nisa
  </text>

  <!-- Item 1: Telur (Rp 8.000) -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="160" height="135" rx="16" fill="#FFFFFF" stroke="#8F8575" stroke-opacity="0.25" stroke-width="1.5"/>
    <!-- Keranjang Telur Visual -->
    <ellipse cx="80" cy="55" rx="42" ry="22" fill="#FFE0B2"/>
    <ellipse cx="65" cy="45" rx="10" ry="14" fill="#FFDE7A" stroke="#2B3445" stroke-width="1.2"/>
    <ellipse cx="82" cy="42" rx="10" ry="14" fill="#FFDE7A" stroke="#2B3445" stroke-width="1.2"/>
    <ellipse cx="98" cy="46" rx="10" ry="14" fill="#FFDE7A" stroke="#2B3445" stroke-width="1.2"/>
    <path d="M 40 55 Q 80 85 120 55 Z" fill="#D7CCC8" stroke="#8D6E63" stroke-width="1.5"/>
    <text x="80" y="90" text-anchor="middle" font-family="'Baloo 2', cursive, sans-serif" font-size="14" font-weight="bold" fill="#2B3445">
      Telur Ayam
    </text>
    <rect x="25" y="100" width="110" height="26" rx="8" fill="#FFF8F0" stroke="#FFDE7A" stroke-width="1.5"/>
    <text x="80" y="117" text-anchor="middle" font-family="'Lexend', sans-serif" font-size="12" font-weight="bold" fill="#1E7A6F">
      Rp 8.000
    </text>
  </g>

  <!-- Simbol Tambah -->
  <g transform="translate(255, 105)">
    <circle cx="15" cy="10" r="18" fill="#7FD4C4" fill-opacity="0.35"/>
    <text x="15" y="18" text-anchor="middle" font-family="'Baloo 2', cursive, sans-serif" font-size="28" font-weight="bold" fill="#1E7A6F">
      +
    </text>
  </g>

  <!-- Item 2: Gula Pasir (Rp 7.000) -->
  <g transform="translate(320, 48)">
    <rect x="0" y="0" width="160" height="135" rx="16" fill="#FFFFFF" stroke="#8F8575" stroke-opacity="0.25" stroke-width="1.5"/>
    <!-- Kantong Gula Visual -->
    <path d="M 55 35 L 105 35 L 115 70 L 45 70 Z" fill="#E0F2F1" stroke="#80CBC4" stroke-width="1.5"/>
    <rect x="62" y="44" width="36" height="18" rx="4" fill="#FFFFFF" stroke="#80CBC4" stroke-width="1"/>
    <text x="80" y="57" text-anchor="middle" font-family="'Lexend', sans-serif" font-size="9" font-weight="bold" fill="#00796B">GULA</text>
    <text x="80" y="90" text-anchor="middle" font-family="'Baloo 2', cursive, sans-serif" font-size="14" font-weight="bold" fill="#2B3445">
      Gula Pasir
    </text>
    <rect x="25" y="100" width="110" height="26" rx="8" fill="#FFF8F0" stroke="#FFDE7A" stroke-width="1.5"/>
    <text x="80" y="117" text-anchor="middle" font-family="'Lexend', sans-serif" font-size="12" font-weight="bold" fill="#1E7A6F">
      Rp 7.000
    </text>
  </g>
</svg>
