<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="100%" height="100%">
  <rect width="500" height="240" rx="20" fill="none" stroke="none" stroke-width="2" stroke-opacity="0.3"/>
  <text x="250" y="30" text-anchor="middle" font-family="Baloo 2, cursive" font-size="16" font-weight="bold" fill="#2B3445">Manakah Jam yang Menunjukkan Pukul 07.00?</text>

  <!-- Opsi A: Jarum Pendek di 7, Jarum Panjang di 12 (07.00) -->
  <g transform="translate(90, 120)">
    <circle cx="0" cy="0" r="48" fill="#FFFFFF" stroke="#1E7A6F" stroke-width="3"/>
    <!-- Angka-angka -->
    <text x="0" y="-34" text-anchor="middle" font-family="Lexend" font-size="10" font-weight="bold" fill="#2B3445">12</text>
    <text x="36" y="4" text-anchor="middle" font-family="Lexend" font-size="10" font-weight="bold" fill="#2B3445">3</text>
    <text x="0" y="42" text-anchor="middle" font-family="Lexend" font-size="10" font-weight="bold" fill="#2B3445">6</text>
    <text x="-36" y="4" text-anchor="middle" font-family="Lexend" font-size="10" font-weight="bold" fill="#2B3445">9</text>
    <!-- Jarum -->
    <line x1="0" y1="0" x2="0" y2="-32" stroke="#2B3445" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-18" y2="20" stroke="#1E7A6F" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="4" fill="#1E7A6F"/>
    <text x="0" y="70" text-anchor="middle" font-family="Lexend" font-size="13" font-weight="bold" fill="#2B3445">(A) Pendek 7, Panjang 12</text>
  </g>

  <!-- Opsi B: Pendek 12, Panjang 7 -->
  <g transform="translate(250, 120)">
    <circle cx="0" cy="0" r="48" fill="#FFFFFF" stroke="#8F8575" stroke-width="2"/>
    <text x="0" y="-34" text-anchor="middle" font-family="Lexend" font-size="10" font-weight="bold" fill="#2B3445">12</text>
    <text x="36" y="4" text-anchor="middle" font-family="Lexend" font-size="10" font-weight="bold" fill="#2B3445">3</text>
    <text x="0" y="42" text-anchor="middle" font-family="Lexend" font-size="10" font-weight="bold" fill="#2B3445">6</text>
    <text x="-36" y="4" text-anchor="middle" font-family="Lexend" font-size="10" font-weight="bold" fill="#2B3445">9</text>
    <line x1="0" y1="0" x2="0" y2="-20" stroke="#2B3445" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-18" y2="30" stroke="#8F8575" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="4" fill="#2B3445"/>
    <text x="0" y="70" text-anchor="middle" font-family="Lexend" font-size="13" font-weight="bold" fill="#2B3445">(B) Pendek 12, Panjang 7</text>
  </g>

  <!-- Opsi C: Pendek 7, Panjang 6 (07.30) -->
  <g transform="translate(410, 120)">
    <circle cx="0" cy="0" r="48" fill="#FFFFFF" stroke="#8F8575" stroke-width="2"/>
    <text x="0" y="-34" text-anchor="middle" font-family="Lexend" font-size="10" font-weight="bold" fill="#2B3445">12</text>
    <text x="36" y="4" text-anchor="middle" font-family="Lexend" font-size="10" font-weight="bold" fill="#2B3445">3</text>
    <text x="0" y="42" text-anchor="middle" font-family="Lexend" font-size="10" font-weight="bold" fill="#2B3445">6</text>
    <text x="-36" y="4" text-anchor="middle" font-family="Lexend" font-size="10" font-weight="bold" fill="#2B3445">9</text>
    <line x1="0" y1="0" x2="-20" y2="18" stroke="#2B3445" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="32" stroke="#8F8575" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="4" fill="#2B3445"/>
    <text x="0" y="70" text-anchor="middle" font-family="Lexend" font-size="13" font-weight="bold" fill="#2B3445">(C) Pendek 7, Panjang 6</text>
  </g>
</svg>