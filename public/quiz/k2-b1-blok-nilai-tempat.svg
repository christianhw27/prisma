<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 230" width="100%" height="100%">
  <rect width="580" height="230" fill="none"/>

  <text x="290" y="26" text-anchor="middle" font-family="'Baloo 2', cursive, sans-serif" font-size="18" font-weight="bold" fill="#2B3445">
    Balok Nilai Tempat: Bilangan 45
  </text>

  <!-- Defs for Unit Cube & 10-Rod -->
  <defs>
    <!-- Single unit cube (Satuan) -->
    <g id="unit-cube">
      <rect x="0" y="0" width="14" height="14" rx="2.5" fill="#FFCA28" stroke="#F57C00" stroke-width="1"/>
      <rect x="2" y="2" width="10" height="3" rx="1" fill="#FFF9C4" opacity="0.6"/>
    </g>

    <!-- Ten-Rod (Batang 10 Kubus Puluhan) -->
    <g id="ten-rod">
      <rect x="0" y="0" width="16" height="110" rx="3" fill="#80CBC4" stroke="#00796B" stroke-width="1.2"/>
      <!-- 10 segments -->
      <line x1="0" y1="11" x2="16" y2="11" stroke="#004D40" stroke-width="0.8"/>
      <line x1="0" y1="22" x2="16" y2="22" stroke="#004D40" stroke-width="0.8"/>
      <line x1="0" y1="33" x2="16" y2="33" stroke="#004D40" stroke-width="0.8"/>
      <line x1="0" y1="44" x2="16" y2="44" stroke="#004D40" stroke-width="0.8"/>
      <line x1="0" y1="55" x2="16" y2="55" stroke="#004D40" stroke-width="0.8"/>
      <line x1="0" y1="66" x2="16" y2="66" stroke="#004D40" stroke-width="0.8"/>
      <line x1="0" y1="77" x2="16" y2="77" stroke="#004D40" stroke-width="0.8"/>
      <line x1="0" y1="88" x2="16" y2="88" stroke="#004D40" stroke-width="0.8"/>
      <line x1="0" y1="99" x2="16" y2="99" stroke="#004D40" stroke-width="0.8"/>
      <!-- Highlight -->
      <rect x="2" y="2" width="12" height="106" fill="#E0F2F1" opacity="0.3"/>
    </g>
  </defs>

  <!-- Left: 4 Batang Puluhan (Nilai 40) -->
  <g transform="translate(60, 45)">
    <rect x="-15" y="0" width="190" height="165" rx="18" fill="#FFF8F0" stroke="#1E7A6F" stroke-opacity="0.25" stroke-width="1.5"/>

    <!-- 4 Batang Berjejer -->
    <use href="#ten-rod" x="20" y="15"/>
    <use href="#ten-rod" x="50" y="15"/>
    <use href="#ten-rod" x="80" y="15"/>
    <use href="#ten-rod" x="110" y="15"/>

    <rect x="10" y="132" width="140" height="24" rx="6" fill="#1E7A6F"/>
    <text x="80" y="148" text-anchor="middle" font-family="'Lexend', sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">
      4 Puluhan = 40
    </text>
  </g>

  <!-- Middle: Simbol Tambah -->
  <g transform="translate(270, 115)">
    <circle cx="15" cy="5" r="18" fill="#7FD4C4" fill-opacity="0.3"/>
    <text x="15" y="13" text-anchor="middle" font-family="'Baloo 2', cursive, sans-serif" font-size="28" font-weight="bold" fill="#1E7A6F">
      +
    </text>
  </g>

  <!-- Right: 5 Kubus Satuan (Nilai 5) -->
  <g transform="translate(330, 45)">
    <rect x="-15" y="0" width="190" height="165" rx="18" fill="#FFFFFF" stroke="#D97706" stroke-opacity="0.25" stroke-width="1.5"/>

    <!-- 5 Kubus Satuan Terpisah -->
    <g transform="translate(45, 45)">
      <use href="#unit-cube" x="0" y="0"/>
      <use href="#unit-cube" x="25" y="0"/>
      <use href="#unit-cube" x="50" y="0"/>
      <use href="#unit-cube" x="12" y="25"/>
      <use href="#unit-cube" x="38" y="25"/>
    </g>

    <rect x="10" y="132" width="140" height="24" rx="6" fill="#D97706"/>
    <text x="80" y="148" text-anchor="middle" font-family="'Lexend', sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">
      5 Satuan = 5
    </text>
  </g>
</svg>
