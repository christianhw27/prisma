<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" width="100%" height="100%">
  <rect width="560" height="210" fill="none"/>

  <text x="280" y="28" text-anchor="middle" font-family="'Baloo 2', cursive, sans-serif" font-size="18" font-weight="bold" fill="#2B3445">
    Menyusun Keping Segitiga Tangram
  </text>

  <!-- Left: 2 Segitiga Terpisah -->
  <g transform="translate(60, 50)">
    <rect x="-10" y="0" width="180" height="135" rx="16" fill="#FFF8F0" stroke="#8F8575" stroke-opacity="0.25" stroke-width="1.5"/>

    <!-- Segitiga 1 -->
    <polygon points="15,100 85,100 85,30" fill="#FFB74D" stroke="#E65100" stroke-width="2"/>
    <!-- Plus -->
    <text x="96" y="75" font-family="'Baloo 2', cursive, sans-serif" font-size="22" font-weight="bold" fill="#1E7A6F">+</text>
    <!-- Segitiga 2 -->
    <polygon points="110,30 110,100 150,100" fill="#FFE082" stroke="#F57C00" stroke-width="2"/>

    <text x="80" y="122" text-anchor="middle" font-family="'Lexend', sans-serif" font-size="11" font-weight="bold" fill="#5B6474">
      2 Segitiga Sama Besar
    </text>
  </g>

  <!-- Middle: Panah Penyatuan -->
  <g transform="translate(265, 110)">
    <circle cx="15" cy="5" r="16" fill="#7FD4C4" fill-opacity="0.3"/>
    <text x="15" y="12" text-anchor="middle" font-family="'Lexend', sans-serif" font-size="18" font-weight="bold" fill="#1E7A6F">
      ➔
    </text>
  </g>

  <!-- Right: Bangun Gabungan (Persegi) -->
  <g transform="translate(325, 50)">
    <rect x="-10" y="0" width="180" height="135" rx="16" fill="#FFFFFF" stroke="#8F8575" stroke-opacity="0.25" stroke-width="1.5"/>

    <!-- Persegi gabungan dari 2 segitiga -->
    <g transform="translate(35, 15)">
      <!-- Segitiga Bawah-Kiri -->
      <polygon points="0,90 90,90 0,0" fill="#FFB74D" stroke="#E65100" stroke-width="2"/>
      <!-- Segitiga Atas-Kanan -->
      <polygon points="90,90 90,0 0,0" fill="#FFE082" stroke="#F57C00" stroke-width="2"/>
      <!-- Garis diagonal sambungan -->
      <line x1="0" y1="0" x2="90" y2="90" stroke="#2B3445" stroke-width="1.8" stroke-dasharray="4 3"/>
    </g>

    <text x="80" y="122" text-anchor="middle" font-family="'Baloo 2', cursive, sans-serif" font-size="14" font-weight="bold" fill="#1E7A6F">
      Menjadi Bangun Apa?
    </text>
  </g>
</svg>
