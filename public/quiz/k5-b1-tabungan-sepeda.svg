<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 230" width="100%" height="100%">
  <rect width="580" height="230" fill="none"/>

  <text x="290" y="28" text-anchor="middle" font-family="'Baloo 2', cursive, sans-serif" font-size="18" font-weight="bold" fill="#2B3445">
    Target Menabung Sepeda Impian Laras
  </text>

  <!-- Left: Sepeda Impian (Rp 850.000) -->
  <g transform="translate(40, 50)">
    <rect x="0" y="0" width="220" height="150" rx="16" fill="#FFF8F0" stroke="#8F8575" stroke-opacity="0.25" stroke-width="1.5"/>

    <!-- Bicycle Graphic -->
    <g transform="translate(45, 20)">
      <!-- Wheels -->
      <circle cx="20" cy="50" r="18" fill="none" stroke="#2B3445" stroke-width="3"/>
      <circle cx="110" cy="50" r="18" fill="none" stroke="#2B3445" stroke-width="3"/>
      <!-- Frame -->
      <polyline points="20,50 55,50 85,25 45,25 20,50" fill="none" stroke="#E53935" stroke-width="3.5" stroke-linejoin="round"/>
      <polyline points="55,50 75,18" fill="none" stroke="#E53935" stroke-width="3.5"/>
      <line x1="85" y1="25" x2="110" y2="50" stroke="#E53935" stroke-width="3.5"/>
      <!-- Seat & Handle -->
      <line x1="40" y1="20" x2="52" y2="20" stroke="#2B3445" stroke-width="4" stroke-linecap="round"/>
      <line x1="78" y1="14" x2="88" y2="14" stroke="#2B3445" stroke-width="4" stroke-linecap="round"/>
    </g>

    <text x="110" y="105" text-anchor="middle" font-family="'Baloo 2', cursive, sans-serif" font-size="14" font-weight="bold" fill="#2B3445">
      Harga Sepeda
    </text>
    <rect x="35" y="112" width="150" height="26" rx="8" fill="#FFFFFF" stroke="#E53935" stroke-width="1.5"/>
    <text x="110" y="130" text-anchor="middle" font-family="'Lexend', sans-serif" font-size="13" font-weight="bold" fill="#C62828">
      Rp 850.000
    </text>
  </g>

  <!-- Minus Symbol -->
  <g transform="translate(275, 115)">
    <circle cx="15" cy="5" r="16" fill="#7FD4C4" fill-opacity="0.3"/>
    <text x="15" y="12" text-anchor="middle" font-family="'Baloo 2', cursive, sans-serif" font-size="28" font-weight="bold" fill="#1E7A6F">
      −
    </text>
  </g>

  <!-- Right: Tabungan Laras Saat Ini (Rp 475.000) -->
  <g transform="translate(320, 50)">
    <rect x="0" y="0" width="220" height="150" rx="16" fill="#FFFFFF" stroke="#8F8575" stroke-opacity="0.25" stroke-width="1.5"/>

    <!-- Piggy Bank / Celengan Icon -->
    <g transform="translate(75, 20)">
      <ellipse cx="35" cy="35" rx="32" ry="24" fill="#FFB74D" stroke="#E65100" stroke-width="2"/>
      <rect x="30" y="14" width="12" height="4" rx="2" fill="#2B3445"/>
      <circle cx="18" cy="30" r="3" fill="#2B3445"/>
      <ellipse cx="10" cy="35" rx="6" ry="8" fill="#FFA726" stroke="#E65100" stroke-width="1.5"/>
      <!-- Kaki celengan -->
      <rect x="18" y="55" width="8" height="10" rx="3" fill="#E65100"/>
      <rect x="42" y="55" width="8" height="10" rx="3" fill="#E65100"/>
    </g>

    <text x="110" y="105" text-anchor="middle" font-family="'Baloo 2', cursive, sans-serif" font-size="14" font-weight="bold" fill="#2B3445">
      Tabungan Laras
    </text>
    <rect x="35" y="112" width="150" height="26" rx="8" fill="#FFF8F0" stroke="#FFDE7A" stroke-width="1.5"/>
    <text x="110" y="130" text-anchor="middle" font-family="'Lexend', sans-serif" font-size="13" font-weight="bold" fill="#1E7A6F">
      Rp 475.000
    </text>
  </g>
</svg>
