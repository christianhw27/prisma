    <!-- 9 telur (3 baris x 3) -->
    <g transform="translate(-40, 50)">
      <ellipse cx="10" cy="10" rx="10" ry="14" fill="#FFDE7A" stroke="#2B3445" stroke-width="1.5"/>
      <ellipse cx="40" cy="10" rx="10" ry="14" fill="#FFDE7A" stroke="#2B3445" stroke-width="1.5"/>
      <ellipse cx="70" cy="10" rx="10" ry="14" fill="#FFDE7A" stroke="#2B3445" stroke-width="1.5"/>
