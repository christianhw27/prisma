      <ellipse cx="40" cy="10" rx="9" ry="13" fill="#FFDE7A" stroke="#2B3445" stroke-width="1.5"/>
      <ellipse cx="65" cy="10" rx="9" ry="13" fill="#FFDE7A" stroke="#2B3445" stroke-width="1.5"/>
