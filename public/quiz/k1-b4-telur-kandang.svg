    <text x="0" y="25" text-anchor="middle" font-family="'Baloo 2', cursive" font-size="15" font-weight="bold" fill="#2B3445">Kandang Kanan</text>
    <!-- 12 telur (4 baris x 3) -->
    <g transform="translate(-50, 45)">
