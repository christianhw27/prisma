    </g>
    <rect x="-60" y="145" width="120" height="28" rx="10" fill="#FFF8F0" stroke="#8F8575" stroke-width="1.5"/>
    <text x="0" y="164" text-anchor="middle" font-family="'Lexend', sans-serif" font-size="13" font-weight="bold" fill="#2B3445">9 Butir Telur</text>
  </g>

  <!-- Kandang Kanan (12 Telur) -->
