<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="100%" height="100%">
  <rect width="500" height="240" rx="20" fill="none" stroke="none" stroke-width="2" stroke-opacity="0.3"/>
  
  <!-- Item A: Tomat -->
  <g transform="translate(80, 110)">
    <circle cx="0" cy="10" r="42" fill="#FF5252" stroke="#2B3445" stroke-width="3"/>
    <ellipse cx="-15" cy="-5" rx="8" ry="14" fill="#FF7B7B" opacity="0.6"/>
    <path d="M 0,-32 Q -12,-48 -5,-55 Q 0,-38 0,-32 Q 12,-48 5,-55 Q 0,-38 0,-32" fill="#1E7A6F" stroke="#2B3445" stroke-width="2"/>
    <path d="M -15,-30 Q -5,-35 0,-32 Q 5,-35 15,-30 Q 8,-25 0,-28 Q -8,-25 -15,-30" fill="#7FD4C4" stroke="#2B3445" stroke-width="2"/>
    <text x="0" y="80" text-anchor="middle" font-family="Lexend, sans-serif" font-size="16" font-weight="bold" fill="#2B3445">(A) Tomat</text>
  </g>

  <!-- Item B: Wortel -->
  <g transform="translate(250, 110)">
    <path d="M -20,-20 L 20,-20 L 0,55 Z" fill="#FFA726" stroke="#2B3445" stroke-width="3" stroke-linejoin="round"/>
    <line x1="-12" y1="0" x2="2" y2="0" stroke="#2B3445" stroke-width="2" opacity="0.4"/>
    <line x1="-2" y1="20" x2="10" y2="20" stroke="#2B3445" stroke-width="2" opacity="0.4"/>
    <!-- Daun Wortel -->
    <path d="M -8,-20 Q -15,-45 -5,-48 Q -5,-25 0,-20 Q 8,-48 15,-45 Q 8,-25 0,-20" fill="#1E7A6F" stroke="#2B3445" stroke-width="2"/>
    <text x="0" y="80" text-anchor="middle" font-family="Lexend, sans-serif" font-size="16" font-weight="bold" fill="#2B3445">(B) Wortel</text>
  </g>

  <!-- Item C: Apel -->
  <g transform="translate(420, 110)">
    <path d="M -35,5 C -35,-30 -5,-35 0,-20 C 5,-35 35,-30 35,5 C 35,40 10,48 0,45 C -10,48 -35,40 -35,5 Z" fill="#E53935" stroke="#2B3445" stroke-width="3"/>
    <path d="M 0,-20 Q 5,-38 12,-42" stroke="#8F8575" stroke-width="4" stroke-linecap="round"/>
    <path d="M 8,-35 Q 22,-45 22,-32 Q 15,-32 8,-35" fill="#7FD4C4" stroke="#2B3445" stroke-width="2"/>
    <text x="0" y="80" text-anchor="middle" font-family="Lexend, sans-serif" font-size="16" font-weight="bold" fill="#2B3445">(C) Apel</text>
